  explain_short: "یہ پیش گوئی ہے، ضمانت نہیں۔ حقیقی سطح تقریباً 10 میں سے 8 دن اس دائرے کے اندر رہتی ہے، اور تقریباً 10 میں سے 1 دن اس کی بالائی حد سے بھی اوپر چلی جاتی ہے۔"
advice:
  good:
    headline: ہوا کا معیار اچھا ہے۔
    actions:
      - معمول کی بیرونی سرگرمیاں جاری رکھیں۔
  moderate:
    headline: ہوا کا معیار قابلِ قبول ہے، تاہم انتہائی حساس افراد کو علامات محسوس ہو سکتی ہیں۔
    actions:
      - "انتہائی حساس افراد باہر سخت مشقت مختصر رکھیں۔"
  usg:
    headline: حساس افراد کے لیے ہوا غیر صحت بخش ہے۔
    actions:
      - "بچے، بزرگ، حاملہ خواتین اور دمہ یا دل اور پھیپھڑوں کے مریض باہر طویل مشقت محدود رکھیں۔"
      - آلودگی کے بدترین اوقات، عموماً صبح سویرے اور شام، میں کھڑکیاں بند رکھیں۔
  unhealthy:
    headline: ہوا ہر ایک کے لیے غیر صحت بخش ہے۔
    actions:
      - باہر طویل یا سخت سرگرمی سے گریز کریں؛ ورزش گھر کے اندر کریں۔
      - باہر جانا ضروری ہو تو درست فٹ ہونے والا N95، KN95 یا FFP2 ماسک پہنیں۔
      - "حساس افراد زیادہ سے زیادہ گھر کے اندر رہیں۔"
  very_unhealthy:
    headline: "بہت زیادہ غیر صحت بخش: صحت کا انتباہ۔"
    actions:
      - بیرونی سرگرمی سے پرہیز کریں۔
      - کھڑکیاں اور دروازے بند رکھیں؛ ایئر پیوریفائر یا بند کمرہ دستیاب ہو تو استعمال کریں۔
      - بچے، بزرگ اور دل یا پھیپھڑوں کے مریض گھر کے اندر رہیں۔
      - باہر جانا ناگزیر ہو تو درست فٹ ہونے والا N95، KN95 یا FFP2 ماسک پہنیں۔
  hazardous:
    headline: "خطرناک: ہنگامی صورتِ حال۔"
    actions:
      - کھڑکیاں اور دروازے بند کر کے گھر کے اندر رہیں۔
      - ہر قسم کی بیرونی مشقت سے پرہیز کریں، بشمول ورزش اور جہاں ممکن ہو سائیکل یا موٹر سائیکل پر سفر۔
      - سینے میں درد، شدید سانس پھولنے یا بے ہوشی کی صورت میں فوراً طبی مدد لیں۔
      - بزرگ پڑوسیوں اور رشتہ داروں کی خبر گیری کریں۔
notes:
  mask_note: کپڑے اور سرجیکل ماسک باریک ذرات سے بہت کم تحفظ دیتے ہیں؛ درست فٹ ہونے والا N95، KN95 یا FFP2 ماسک کہیں زیادہ مؤثر ہے۔
  indoor_air_note: گھر کے اندر دھواں بڑھانے والی چیزوں (سگریٹ نوشی، اگربتی، کچرا جلانا) سے پرہیز کریں۔
  sensitive_note: بچے، بزرگ، حاملہ خواتین اور دمہ، دل یا پھیپھڑوں کے مریض سب سے زیادہ خطرے میں ہیں۔
mode_banner:
  stale_cams: "درستگی میں کمی: فضائی ماڈل کی تازہ ترین پیش گوئی ابھی دستیاب نہیں تھی، اس لیے پچھلی پیش گوئی استعمال کی گئی۔"
  observations_only: "درستگی میں کمی: سیٹلائٹ اور ماڈل کے ڈیٹا دستیاب نہیں تھے؛ یہ پیش گوئی صرف حالیہ سینسر ریڈنگز پر مبنی ہے۔"
  baseline_only: "سادہ پیش گوئی: آج سیکھنے والا ماڈل دستیاب نہیں تھا، اس لیے نسبتاً سادہ طریقہ استعمال کیا گیا۔"
methodology:
  short: "اسموگ سینس حالیہ سینسر ریڈنگز، سیٹلائٹ سے آگ کی نشاندہی اور فضائی ماڈل کی پیش گوئیوں کو ملا کر کام کرتا ہے۔ ایک سیکھنے والا ماڈل، جو پہلے دہلی کے وسیع مانیٹرنگ نیٹ ورک پر تربیت پاتا ہے اور پھر لاہور کے چند سینسرز کے مطابق ڈھالا جاتا ہے، PM2.5 کی ممکنہ سطحوں کا دائرہ بتاتا ہے۔"
disclaimer: "اسموگ سینس ایک تحقیقی منصوبہ ہے، سرکاری پیش گوئی نہیں۔ طبی یا ہنگامی فیصلوں کے لیے صرف اس پر انحصار نہ کریں۔ سرکاری محکمۂ صحت اور ماحولیات کی ہدایات پر عمل کریں۔"
attribution: "فضائی معیار کے مشاہدات: OpenAQ اور اس کے ڈیٹا فراہم کنندگان۔ فضائی پیش گوئیاں: Generated using Copernicus Atmosphere Monitoring Service information 2026۔ آگ کی نشاندہی: NASA FIRMS۔"
