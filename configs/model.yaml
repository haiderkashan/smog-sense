  aci_gamma: 0.02
  aci_gamma_grid:
  - 0.01
  - 0.02
  - 0.05
base:
  inputs:
  - tabular
  - cams_lead_offset_h
  boosters_per_horizon: 19
  bind_base_sha256: true
  cross_fit:
    max_folds: 3
    embargo_h: 72
    purging: true
