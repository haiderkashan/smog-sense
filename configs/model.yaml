version: 1
seed: 20261004
device: cpu
threads: 2
promoted_bundle: none
target:
  horizons_h:
  - 24
  - 48
  - 72
  block_hours: 24
  min_valid_hours: 18
  transform: log1p
quantiles:
  public:
  - 0.1
  - 0.5
  - 0.9
  grid:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  tune_on:
  - 0.1
  - 0.5
  - 0.9
  tails:
    upper: exponential
    lower: loglinear
    floor_ugm3: 0.0
encoder:
  kind: gru
  latent_dim: 32
  gru:
    hidden: 64
    layers: 2
    dropout: 0.1
  tcn:
    channels:
    - 32
    - 32
    - 64
    - 64
    - 64
    kernel: 3
    dilations:
    - 1
    - 2
    - 4
    - 8
    - 16
    convs_per_block: 2
    dropout: 0.1
head:
  input_dim: 46
  hidden:
  - 64
  output_dim: 57
  activation: relu
  dropout: 0.0
  zero_init_last_layer: true
  rearrange: monotone_sort
lgbm:
  objective: quantile
  params:
    num_leaves: 31
    learning_rate: 0.03
    n_estimators: 2000
    early_stopping_rounds: 100
    min_data_in_leaf: 40
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 5.0
    max_bin: 255
    deterministic: true
    force_row_wise: true
    num_threads: 2
    verbosity: -1
  rearrange: monotone_sort
meta:
  algorithm: fomaml
  adapt_scope: all
  second_order: false
  tasks:
    meta_batch: 8
    support_days: 14
    query_days: 14
  inner:
    steps: 3
    step_size_granularity: per_tensor
    lr_init: 0.01
    loss: pinball
    grad_clip: 1.0
  outer:
    optimizer: adam
    lr: 0.001
    iterations: 3000
    grad_clip: 1.0
adaptation:
  inner:
    loss: pinball
    alpha: 0.01
    steps: 3
    support_days:
    - 7
    - 14
    - 30
    grad_clip: 1.0
    adapt_scope: all
  acceptance:
    embargo_h: 72
    min_improvement: 0.02
    min_days_better_fraction: 0.6
  residual_bound:
    statistic: mean_abs_residual
    threshold_quantile: 0.99
  rh_mask:
    enabled: false
    threshold_pct: 85
    source: device_else_cams
    scope: lowcost_only
    min_support_fraction: 0.5
corruption:
