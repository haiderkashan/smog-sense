# Local static server that mimics production delivery of ./site (GitHub Pages / Cloudflare Pages).
# Runs unprivileged and read-only: every writable path lives in /tmp (a tmpfs in docker-compose.yml).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # WOFF2 and JSON are not in every mime.types
  types {
    font/woff2 woff2;
    application/json json;
  }

  server {
    listen 8080;
    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # Same security posture we ship in the Cloudflare `_headers` file and the <meta> CSP on GitHub Pages.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Fingerprinted assets are immutable; HTML/JSON/cards are short-lived (GitHub Pages serves max-age=600).
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* \.(html|json|png|xml|txt)$ { add_header Cache-Control "public, max-age=600"; try_files $uri =404; }

    location / { try_files $uri $uri/ $uri/index.html =404; }
    error_page 404 /404.html;
  }
}
