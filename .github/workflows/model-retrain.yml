# Manual training run. Heavy training normally happens on a student laptop or here (public repos get a
# 4 vCPU / 16 GB runner and a 6 h job limit; the models are deliberately small enough for CPU).
# Output: a versioned model bundle published as a GitHub Release (never committed to Git).
# PROMOTION is a pull request that changes `bundle.tag` in configs/model.yaml: review is the gate.
name: model-retrain

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version, MAJOR.MINOR.PATCH (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smogsense-retrain
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SMOGSENSE_MODE: live
      SMOGSENSE_CPUS: "4"
      SMOGSENSE_MEM: 14g
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: '[[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be MAJOR.MINOR.PATCH"; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare host
        run: |
          {
            echo "HOST_UID=$(id -u)"
            echo "HOST_GID=$(id -g)"
            echo "SMOGSENSE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          } >> "$GITHUB_ENV"
          mkdir -p data/raw data/interim data/processed/backfill data/external models/bundle site .state

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the runtime image (build locally if absent)
        run: |
          docker pull "${SMOGSENSE_IMAGE}" || docker build --target runtime -t "${SMOGSENSE_IMAGE}" .

      - name: Download backfilled inputs from the rolling data release
        run: gh release download data-backfill --dir data/processed/backfill --pattern '*.parquet'

      - name: Build training sets (feature store, sparse-network tasks)
        run: docker compose --profile ops run --rm pipeline smogsense features backfill

      - name: Stage 1 - source-domain pre-training (Delhi)
        run: docker compose --profile ops run --rm pipeline smogsense train source

      - name: Stage 2 - meta-learning of encoder and head (first-order MAML / ANIL)
        run: docker compose --profile ops run --rm pipeline smogsense train meta

      - name: Stage 3 - LightGBM quantile ensemble (one booster per level and horizon)
        run: docker compose --profile ops run --rm pipeline smogsense train lgbm

      - name: Stage 4 - calibration (CQR + ACI parameters)
        run: docker compose --profile ops run --rm pipeline smogsense train calibrate

      - name: Stage 5 - bundle (weights + manifest with sha256 + model card)
        run: docker compose --profile ops run --rm pipeline smogsense train bundle --version "${VERSION}"

      - name: Model-ladder and sensor-sparsity evaluation
        run: |
          docker compose --profile ops run --rm pipeline smogsense eval ladder
          docker compose --profile ops run --rm pipeline smogsense eval sparsity

      - name: Publish the bundle as a pre-release
        run: |
          gh release create "models-v${VERSION}" models/bundle/* \
            --prerelease --title "Model bundle v${VERSION}" --notes-file models/bundle/model_card.md
