# Keeps pinned GitHub Actions SHAs, the base image, and Python dependencies current.
# Security updates arrive as pull requests; nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Karachi
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Karachi
    commit-message:
      prefix: "chore"

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Karachi
    commit-message:
      prefix: "chore"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
