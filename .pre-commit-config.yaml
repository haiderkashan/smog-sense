# Install once:  pipx install pre-commit && make hooks
# Hook revisions were verified (existence of every hook id) in October 2026. Update with:  pre-commit autoupdate
minimum_pre_commit_version: "4.0.0"
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-toml
      - id: check-json
      - id: check-yaml
        args: ["--unsafe"]          # GitHub/Compose YAML uses tags and merge keys
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-github-workflows-require-timeout
      - id: check-github-actions
      - id: check-dependabot
      - id: check-compose-spec
        files: ^docker-compose\.ya?ml$
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-citation-file-format
      - id: check-metaschema
        files: ^data/schemas/.*\.json$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]
        exclude: ^data/schemas/.*\.schema\.yaml$   # machine-generated by pandera

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["-x"]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
