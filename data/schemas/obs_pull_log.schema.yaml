schema_type: dataframe
columns:
  sensor_id:
    type: str
    nullable: false
    description: Sensor identifier.
  location_id:
    type: str
    nullable: false
    description: Location or station identifier.
  domain:
    type: str
    nullable: false
    description: Domain string (e.g. lahore).
  ts_utc:
    type: datetime
    nullable: false
    description: Observation timestamp (hour-start).
  hour_end_utc:
    type: datetime
    nullable: false
    description: End of observation hour window (ts_utc + 1h).
  first_seen_utc:
    type: datetime
    nullable: false
    description: Timestamp when observation was first pulled and recorded.
  pull_id:
    type: str
    nullable: false
    description: Unique ingestion pull identifier.
  value_raw:
    type: float
    nullable: true
    description: Raw PM2.5 measurement in ug/m3.
  rh_pct:
    type: float
    nullable: true
    description: Relative humidity percentage.
  temp_c:
    type: float
    nullable: true
    description: Ambient temperature in degrees Celsius.
  provider:
    type: str
    nullable: false
    description: Observation network provider.
  source:
    type: str
    nullable: false
    description: Ingestion source string (e.g. openaq_api).
unique:
- sensor_id
- ts_utc
- pull_id
description: Ingestion log recording first-seen observation times for latency measurement.
