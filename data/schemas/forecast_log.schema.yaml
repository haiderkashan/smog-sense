schema_type: dataframe
api: pandas
columns:
  issuance_utc:
    description: Forecast reference time T0.
    dtype: datetime64[ns, UTC]
    coerce: true
  generated_at_utc:
    description: Wall-clock time the forecast was produced.
    dtype: datetime64[ns, UTC]
    coerce: true
  domain:
    description: Domain id.
    dtype: string[python]
    coerce: true
    isin:
    - lahore
    - delhi
    - amritsar
    - ludhiana
  level:
    description: station = per-sensor forecast; city = aggregate shown in the bulletin.
    dtype: string[python]
    coerce: true
    isin:
    - station
    - city
  point_id:
    description: '''station:<location_id>'' or ''city:<domain>''.'
    dtype: string[python]
    coerce: true
  horizon_h:
    description: 'Block end offset: the forecast is the mean over the 24 hours [T0+h-24h,
      T0+h) (hour-start labels).'
    dtype: int32
    coerce: true
    isin:
    - 24
    - 48
    - 72
  window_start_utc:
    description: Start of the verification block (inclusive; hour-start labels, so
      the block is the half-open interval [start, end)).
    dtype: datetime64[ns, UTC]
    coerce: true
  window_end_utc:
    description: End of the verification block (exclusive). The block contains the
      24 hours labelled start .. end-1h.
    dtype: datetime64[ns, UTC]
    coerce: true
  method:
    description: Model ladder id.
    dtype: string[python]
    coerce: true
    isin:
    - m0_persistence
    - m1_cams_raw
    - m2_cams_bc
    - m3_climatology_qr
    - m4_lgbm_local
    - m5_lgbm_source_zero_shot
    - m6_finetune_transfer
    - m7_hybrid_maml
    - m8_hybrid_maml_calibrated
  model_version:
    description: Bundle tag (e.g. models-v0.2.0) or 'baseline'.
    dtype: string[python]
    coerce: true
  mode:
    description: Degradation-ladder mode in force.
    dtype: string[python]
    coerce: true
    isin:
    - full
    - stale_cams
    - observations_only
    - baseline_only
  cams_base_time_utc:
    description: CAMS run used (as-of rule).
    dtype: datetime64[ns, UTC]
    nullable: true
    coerce: true
  data_cutoff_utc:
    description: Latest observation time that was knowable at generation.
    dtype: datetime64[ns, UTC]
    coerce: true
  git_sha:
    description: Code version.
    dtype: string[python]
    coerce: true
  config_hash:
    description: sha256 of the full effective configuration.
    dtype: string[python]
    coerce: true
  calibrated:
    description: True if the online recalibration layer (CQR+ACI) was applied.
    dtype: bool
    coerce: true
  q05:
    description: Forecast 05th percentile of the block-mean PM2.5, ug/m3 (monotone
      after rearrangement).
    dtype: float64
    coerce: true
    greater_than_or_equal_to: 0
  q10:
    description: Forecast 10th percentile of the block-mean PM2.5, ug/m3 (monotone
      after rearrangement).
    dtype: float64
    coerce: true
    greater_than_or_equal_to: 0
  q15:
    description: Forecast 15th percentile of the block-mean PM2.5, ug/m3 (monotone
      after rearrangement).
    dtype: float64
    coerce: true
    greater_than_or_equal_to: 0
  q20:
