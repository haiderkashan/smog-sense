  run_id:
    type: str
    nullable: false
  is_rerun:
    type: bool
    nullable: false
  adaptation_status:
    type: str
    nullable: true
  cams_lead_offset_h:
    type: float
    nullable: true
  n_available_stations:
    type: int
    nullable: true
coerce: true
strict: true
name: forecast_log
unique:
- issuance_utc
- point_id
- horizon_h
- method
description: 'Append-only forecast ledger: 19 quantile levels per (issuance, point,
  horizon, method).'
