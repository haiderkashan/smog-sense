[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "smogsense"
version = "0.1.0"
description = "Probabilistic PM2.5 forecasting for sensor-sparse regions: few-shot transfer from Delhi to Lahore, zero-cost, bilingual."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "SmogSense contributors" }]
keywords = ["air-quality", "pm2.5", "probabilistic-forecasting", "meta-learning", "lahore"]

# Runtime dependencies. Lower bounds track the versions verified to resolve together on
# Python 3.12 / manylinux in October 2026; exact pins live in uv.lock (generated by `make lock`).
dependencies = [
  # --- numerical core ---
  "numpy>=2.3",
  "pandas>=3.0,<4",
  "pyarrow>=21",
  "scipy>=1.16",
  "scikit-learn>=1.7",
  # --- geospatial / gridded data (eccodes pulls eccodeslib, a self-contained ecCodes build) ---
  "xarray>=2025.9",
  "netCDF4>=1.7",
  "cfgrib>=0.9.15",
  "eccodes>=2.43",
  "pyproj>=3.7",
  "shapely>=2.1",
  # --- data acquisition ---
  "httpx>=0.28",
  "tenacity>=9.0",
  "cdsapi>=0.7.6",
  # --- contracts, config, CLI ---
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pandera>=0.30",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "typer>=0.16",
  "structlog>=24.0",
  # --- modelling (CPU only; see [tool.uv.sources]) ---
  "torch>=2.8",
  "lightgbm>=4.6",
  "scoringrules>=0.8",
  # --- publishing ---
  "jinja2>=3.1",
  "pillow>=11",           # wheels bundle Raqm/HarfBuzz/FriBiDi -> correct Urdu Nastaliq shaping
  "matplotlib>=3.10",     # English-only diagnostics; cannot shape Urdu
  "fonttools>=4.59",
  "brotli>=1.1",
]

[project.optional-dependencies]
# Research-only: MODIS MAIAC AOD (MODIS end-of-mission 2026-27; excluded from operational features)
maiac = ["earthaccess>=0.14"]
notebooks = ["jupyterlab>=4.4", "ipykernel>=6.29"]

[project.scripts]
smogsense = "smogsense.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "hypothesis>=6.135",
  "respx>=0.22",
  "ruff>=0.12",
  "mypy>=1.17",
  "pandas-stubs>=2.3",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
  "pre-commit>=4.2",
  "check-jsonschema>=0.33",
  "yamllint>=1.37",
]

# -----------------------------------------------------------------------------
# uv: CPU-only PyTorch on Linux (the default PyPI wheel for x86-64 Linux is the CUDA build, ~GBs)
# -----------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/smogsense"]

# -----------------------------------------------------------------------------
# Ruff (lint + format)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "S", "PD", "NPY", "PERF"]
ignore = [
  "E501",   # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PD011"]

[tool.ruff.format]
quote-style = "double"

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cfgrib.*", "eccodes.*", "cdsapi.*", "lightgbm.*", "scoringrules.*", "earthaccess.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest / coverage
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast, pure-function tests (no I/O)",
  "contract: schema and API-shape contracts (recorded payloads; live only with --run-network)",
  "integration: multi-stage pipeline tests on fixtures",
  "e2e: end-to-end site build on fixtures",
  "network: touches the real network (excluded from CI by default)",
  "slow: > 10 s",
]
filterwarnings = ["error::DeprecationWarning:smogsense.*"]

[tool.coverage.run]
source = ["src/smogsense"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
